<line x1="340" y1="250" x2="340" y2="296" stroke="#9b9a97" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
<text x="348" y="276" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="start">persist</text>
