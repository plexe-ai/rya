<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renewals - BBG Credit</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbfa; --surface:#ffffff; --inset:#f7f7f5;
  --ink:#191918; --ink-2:#37352f; --ink-3:#787774; --ink-4:#9b9a97;
  --line:#ebebea; --line-2:#e3e2e0;
  --pos:#0f7b6c; --pos-bg:#ecf3f0; --warn:#c2691f; --warn-bg:#faf3eb;
  --blue:#37618e; --blue-bg:#edf1f6; --clay:#a34d43; --clay-bg:#f6ebe9;
  --r:4px; --r-card:8px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink-2);
  font:14px/1.55 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01','ss03'}
::selection{background:var(--blue-bg);color:var(--ink)}
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:100px;border:2px solid transparent;background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--ink-4);background-clip:content-box}
*::-webkit-scrollbar-track{background:transparent}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tnum{font-variant-numeric:tabular-nums}
svg.ic{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-2.5px}
.chip{display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 11px;
  border:1px solid var(--line-2);border-radius:100px;background:var(--surface);
  font-size:11.5px;font-weight:500;color:var(--ink-3);white-space:nowrap;letter-spacing:.01em}
.chip.mono{font-weight:400}
.chip .pulse{width:6px;height:6px;border-radius:50%;background:var(--pos);position:relative}
.chip .pulse::after{content:'';position:absolute;inset:-3px;border-radius:50%;
  border:1px solid var(--pos);opacity:0;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.5);opacity:.5}70%{transform:scale(1.4);opacity:0}100%{opacity:0}}
button{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:9px 15px;font:500 13px Inter,-apple-system,sans-serif;
  cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .06s;
  display:inline-flex;align-items:center;gap:7px;letter-spacing:-.004em}
button:active{transform:scale(.985)}
button:hover{background:var(--bg);border-color:var(--ink-4)}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.primary:hover{background:#000}
button.pos{background:var(--pos);color:#fff;border-color:var(--pos)}
button.pos:hover{background:#0c6a5d}
button.quiet{border-color:transparent;color:var(--blue);padding:6px 10px;border-radius:6px}
button.quiet:hover{background:var(--blue-bg);border-color:transparent}
button:disabled{opacity:.4;cursor:default;pointer-events:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:3px 10px;border-radius:100px;transition:all .25s var(--ease);letter-spacing:.01em}
.b-done{background:var(--pos-bg);color:var(--pos)}
.b-run{background:var(--blue-bg);color:var(--blue)}
.b-appr{background:var(--warn-bg);color:var(--warn)}
.b-fail{background:var(--clay-bg);color:var(--clay)}
.b-wait{background:var(--surface);color:var(--ink-4);border:1px solid var(--line-2)}
.spin{width:10px;height:10px;border:1.5px solid var(--blue);border-top-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ================= app shell ================= */
.app{display:grid;grid-template-columns:224px 1fr;height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line-2);display:flex;
  flex-direction:column;padding:14px 10px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.mark{width:28px;height:28px;border-radius:8px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-weight:600;font-size:13px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.brand .bt{font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:-.008em}
.brand .bs{font-size:11px;color:var(--ink-4)}
.navlbl{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-4);padding:10px 10px 6px}
.navitem{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;
  font-size:13.5px;color:var(--ink-2);cursor:pointer;transition:background .12s;
  border:none;background:none;width:100%;text-align:left;font-weight:500}
.navitem svg.ic{color:var(--ink-3)}
.navitem:hover{background:var(--inset);border:none}
.navitem.on{background:var(--blue-bg);color:var(--ink)}
.navitem.on svg.ic{color:var(--blue)}
.navitem .cnt{margin-left:auto;font-size:11px;font-weight:600;color:var(--warn);
  background:var(--warn-bg);border-radius:100px;padding:1px 8px;font-variant-numeric:tabular-nums}
.navitem .cnt.zero{display:none}
aside .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:10px}
aside .foot .chip{justify-content:flex-start}
.view{min-width:0;min-height:0;display:flex;flex-direction:column}

/* ================= list views (cases / approvals) ================= */
.page{max-width:960px;width:100%;margin:0 auto;padding:40px 40px 60px;overflow-y:auto}
.pagehead{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.pagehead h1{font-size:22px;font-weight:700;letter-spacing:-.018em;color:var(--ink)}
.pagehead .sub{font-size:13px;color:var(--ink-4);margin-top:3px}
.pagehead .spacer{flex:1}
.listcard{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-card);
  overflow:hidden;animation:rise .24s var(--ease) both}
.lrow{display:flex;align-items:center;gap:16px;padding:14px 20px;border-top:1px solid var(--line);
  cursor:pointer;transition:background .12s}
.lrow:first-child{border-top:none}
.lrow:hover{background:var(--inset)}
.lrow .cid{font-size:14px;font-weight:600;color:var(--ink);width:110px;flex:none}
.lrow .cust{flex:1;min-width:0}
.lrow .cust .cn{font-size:13.5px;font-weight:500;color:var(--ink)}
.lrow .cust .cm{font-size:12px;color:var(--ink-4)}
.lrow .meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-4)}
.lrow .chev{color:var(--ink-4)}
.listempty{padding:48px 20px;text-align:center;color:var(--ink-4);font-size:13px}
.apr-row{display:flex;gap:16px;padding:18px 20px;border-top:1px solid var(--line);align-items:flex-start}
.apr-row:first-child{border-top:none}
.apr-row .body{flex:1;min-width:0}
.apr-row .t{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.006em}
.apr-row .prev{font-size:12.5px;color:var(--ink-3);margin-top:4px;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.apr-row .acts{display:flex;gap:6px;flex:none;align-items:center}

/* ================= case workspace ================= */
.work{display:grid;grid-template-columns:minmax(380px,43%) 1fr;height:100%;min-height:0}
.workhead{grid-column:1/-1;display:flex;align-items:center;gap:12px;height:52px;
  padding:0 22px;border-bottom:1px solid var(--line-2);background:var(--surface)}
.workhead .back{padding:6px;border-radius:6px;border-color:transparent;color:var(--ink-3)}
.workhead .back:hover{background:var(--inset);border-color:transparent}
.workhead .wt{font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-.008em}
.workhead .ws{font-size:12px;color:var(--ink-4)}
.workhead .right{margin-left:auto;display:flex;gap:8px}
.work-grid{display:contents}
.chat{display:flex;flex-direction:column;border-right:1px solid var(--line-2);
  min-width:0;min-height:0;background:var(--surface)}
.msgs{flex:1;overflow-y:auto;padding:26px 30px 8px;display:flex;flex-direction:column;
  scroll-behavior:smooth}
.daymark{align-self:center;font-size:11px;font-weight:500;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-4);padding:2px 10px;border:1px solid var(--line);
  border-radius:100px;margin-bottom:22px}
.turn{display:flex;gap:12px;margin-bottom:22px;animation:rise .22s var(--ease) both}
.av{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;
  font-size:10.5px;font-weight:600;margin-top:1px}
.turn.agent .av{background:var(--ink);color:#fff}
.turn.user .av{background:var(--surface);color:var(--ink-3);border:1px solid var(--line-2)}
.tbody{flex:1;min-width:0}
.tmeta{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.tname{font-size:12.5px;font-weight:600;color:var(--ink);letter-spacing:-.006em}
.when{font-size:11px;color:var(--ink-4);opacity:0;transition:opacity .15s}
.turn:hover .when{opacity:.9}
.ttext{font-size:13.5px;line-height:1.62;color:var(--ink-2);white-space:pre-wrap;max-width:62ch}
.turn.activity{margin-bottom:14px;align-items:center}
.turn.activity .av{background:none;border:none;color:var(--ink-4)}
.turn.activity .av svg.ic{width:13px;height:13px}
.turn.activity .ttext{font-size:12.5px;color:var(--ink-3)}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--ink-4);
  animation:tp 1.1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-2px)}}
.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:0 24px 12px}
.suggest button{border-radius:100px;font-weight:400;font-size:12.5px;color:var(--ink-3);
  padding:6px 13px}
.suggest button:hover{color:var(--ink);border-color:var(--ink-4);background:var(--surface)}
.composer{padding:14px 22px 20px;border-top:1px solid var(--line);background:var(--surface)}
.cbox{display:flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:10px;
  padding:6px 6px 6px 14px;background:var(--surface);transition:border-color .15s, box-shadow .15s}
.cbox:focus-within{border-color:var(--ink-3);box-shadow:0 0 0 3px rgba(25,25,24,.05)}
.cbox input{flex:1;border:none;font:inherit;font-size:13.5px;background:none;color:var(--ink);padding:5px 0}
.cbox input::placeholder{color:var(--ink-4)}
.cbox input:focus{outline:none}
.sendbtn{width:30px;height:30px;padding:0;border-radius:7px;justify-content:center;
  background:var(--ink);color:#fff;border-color:var(--ink)}
.sendbtn:hover{background:#000}
.sendbtn svg.ic{width:14px;height:14px}

.case{overflow-y:auto;padding:26px 32px 56px;display:flex;flex-direction:column;gap:16px;min-height:0}
.empty{margin:auto;text-align:center;color:var(--ink-4);display:flex;flex-direction:column;
  align-items:center;gap:14px;max-width:380px}
.empty .t{font-size:15px;font-weight:600;color:var(--ink-2)}
.empty .s{font-size:13px;line-height:1.6}
.card{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-card);
  padding:20px 22px;animation:rise .26s var(--ease) both}
.card h2{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);margin-bottom:16px}
.card h2 svg.ic{width:14px;height:14px;color:var(--ink-4)}
.card h2 .tail{margin-left:auto;display:flex;gap:6px;text-transform:none;letter-spacing:0;font-weight:400}
.kgrid{display:grid;grid-template-columns:repeat(4,auto) 1fr;gap:8px 40px;align-items:baseline}
.kgrid .n{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.022em;line-height:1.15}
.kgrid .n.name{font-size:20px;font-weight:600;letter-spacing:-.014em}
.kgrid .l{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4);margin-top:4px}
.steps{display:flex;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.step{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-4);white-space:nowrap;transition:color .3s}
.step .dt{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line-2);
  background:var(--surface);transition:all .35s var(--ease)}
.step.on{color:var(--ink);font-weight:600}
.step.on .dt{border-color:var(--blue);background:var(--blue);box-shadow:0 0 0 3.5px var(--blue-bg)}
.step.done{color:var(--ink-3)}
.step.done .dt{border-color:var(--pos);background:var(--pos)}
.step-line{flex:1;height:1.5px;background:var(--line);margin:0 12px;min-width:16px;position:relative;overflow:hidden;border-radius:2px}
.step-line i{position:absolute;inset:0;background:var(--pos);transform:scaleX(0);
  transform-origin:left;transition:transform .5s var(--ease)}
.step-line.fill i{transform:scaleX(1)}
.row{display:flex;align-items:center;gap:11px;padding:10px 10px;margin:0 -10px;
  border-top:1px solid var(--line);font-size:13.5px;color:var(--ink-2);border-radius:6px;
  transition:background .15s}
.row:first-of-type{border-top:none}
.row:hover{background:var(--inset)}
.row .doc-ic{width:30px;height:30px;border-radius:7px;border:1px solid var(--line-2);
  background:var(--inset);display:grid;place-items:center;color:var(--ink-3);flex:none}
.row .doc-ic svg.ic{width:14px;height:14px}
.row .grow{flex:1;display:flex;flex-direction:column;gap:1px;min-width:0}
.row .grow .lbl{font-weight:500;color:var(--ink);letter-spacing:-.004em}
.row .grow .meta{display:flex;gap:8px;font-size:11.5px;color:var(--ink-4)}
.row .dur{font-size:11.5px;color:var(--ink-4);margin-right:2px}
.hint{color:var(--ink-4);font-size:12px;margin-top:14px;line-height:1.6}
.row.dragover{background:var(--blue-bg);box-shadow:inset 0 0 0 1.5px var(--blue)}
.up-actions{display:flex;gap:2px;align-items:center}
.tl{position:relative;padding-left:4px}
.tlrow{position:relative;display:flex;align-items:center;gap:12px;padding:9px 0 9px 24px;font-size:13px}
.tlrow::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:1.5px;background:var(--line)}
.tlrow:first-child::before{top:50%}
.tlrow:last-child::before{bottom:50%}
.tlrow:only-child::before{display:none}
.tldot{position:absolute;left:2.5px;top:50%;transform:translateY(-50%);width:10px;height:10px;
  border-radius:50%;border:1.5px solid var(--line-2);background:var(--surface);z-index:1;
  transition:all .3s var(--ease)}
.tldot.done{border-color:var(--pos);background:var(--pos)}
.tldot.run{border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 3px var(--blue-bg)}
.tldot.appr{border-color:var(--warn);background:var(--warn)}
.tldot.fail{border-color:var(--clay);background:var(--clay)}
.tlrow .grow{flex:1;min-width:0}
.meta-strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sheetwrap{max-height:420px;overflow-y:auto;border-radius:6px;background:var(--inset);
  border:1px solid var(--line);padding:18px}
.sheet{background:var(--surface);border:1px solid var(--line-2);border-top:2.5px solid var(--ink);
  border-radius:2px;padding:30px 34px;max-width:660px;margin:0 auto;font-size:13px;color:var(--ink-2)}
.sheet .h1r{font-size:19px;font-weight:700;letter-spacing:-.018em;color:var(--ink);
  margin:0 0 4px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.sheet .h2r{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);margin:24px 0 8px}
.sheet p{margin:7px 0;line-height:1.6}
.sheet table{border-collapse:collapse;width:100%;margin:8px 0 4px;font-size:12.5px}
.sheet td,.sheet th{border-bottom:1px solid var(--line);padding:7px 12px 7px 0;
  text-align:left;vertical-align:top;line-height:1.5}
.sheet tr:last-child td{border-bottom:none}
.sheet th{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-4)}
.sheet .cite{display:inline-block;font:500 10px ui-monospace,Menlo,monospace;
  color:var(--blue);background:var(--blue-bg);border-radius:3px;padding:1px 5px;margin:0 2px;
  white-space:nowrap;vertical-align:1px}
.approve-bar{display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);align-items:center}
.approve-bar .hint{margin:0;flex:1;text-align:right}
.callout{display:flex;gap:12px;border:1px solid var(--line-2);border-left:2.5px solid var(--pos);
  background:var(--pos-bg);border-radius:6px;padding:14px 16px;font-size:13px;color:var(--ink-2);line-height:1.55}
.callout b{color:var(--ink)}
.checkdraw{width:19px;height:19px;flex:none;margin-top:1px}
.checkdraw circle{stroke:var(--pos);stroke-width:1.6;fill:none;stroke-dasharray:57;
  stroke-dashoffset:57;animation:draw .5s var(--ease) .1s forwards}
.checkdraw path{stroke:var(--pos);stroke-width:2;fill:none;stroke-linecap:round;
  stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14;animation:draw .3s var(--ease) .55s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (max-width:960px){.app{grid-template-columns:1fr}aside{display:none}.work{grid-template-columns:1fr}.case{display:none}}
</style>

<div class="app">
  <aside>
    <div class="brand">
      <div class="mark">R</div>
      <div><div class="bt">BBG Credit</div><div class="bs">Renewals workspace</div></div>
    </div>
    <div class="navlbl">Workspace</div>
    <button class="navitem" id="nav-cases" onclick="location.hash='#/cases'">
      <svg class="ic" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      Cases</button>
    <button class="navitem" id="nav-approvals" onclick="location.hash='#/approvals'">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      Approvals<span class="cnt zero" id="aprCount">0</span></button>
    <div class="navlbl">Actions</div>
    <button class="navitem" onclick="location.hash='#/case/new'">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      New renewal</button>
    <div class="foot">
      <span class="chip"><span class="pulse"></span>agent live</span>
      <span class="chip mono">bedrock</span>
      <div id="userFoot"></div>
    </div>
  </aside>
  <div class="view" id="view"></div>
</div>

<input type="file" id="filePick" accept=".pdf,.csv,.txt,.doc,.docx,.xls,.xlsx" style="display:none">
<script>
const API = 'http://localhost:8931';
let auth = JSON.parse(localStorage.getItem('rya.auth') || 'null');
function saveAuth(a){ auth = a;
  if(a) localStorage.setItem('rya.auth', JSON.stringify(a));
  else localStorage.removeItem('rya.auth'); }
async function apiFetch(path, opts = {}){
  opts.headers = Object.assign({}, opts.headers || {},
    auth && auth.wsKey ? {'authorization': 'Bearer ' + auth.wsKey} : {});
  const r = await fetch(API + path, opts);
  if(r.status === 401){ saveAuth(null); location.hash = '#/login'; throw new Error('unauthorized'); }
  return r;
}
const emailName = e => (e || '').split('@')[0].replace(/^./, c => c.toUpperCase());
const initials = e => (e || '?').slice(0, 2).toUpperCase();
const DOC_ICONS = {
  aecb: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
  spread: '<svg class="ic" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/></svg>',
  id: '<svg class="ic" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><path d="M14 9h5M14 13h5M6 17c.5-1.5 1.5-2 2.5-2s2 .5 2.5 2"/></svg>',
  reference_report: '<svg class="ic" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/></svg>',
};

  if(s < 60) return 'just now';

  if(s < 86400) return Math.round(s/3600) + 'h ago';
  return Math.round(s/86400) + 'd ago';
};

/* ================= server-derived model ================= */
async function fetchAll(){
  const [runsR, aprR, filesR] = await Promise.all([
    apiFetch(`/agents/loan-renewal/runs`), apiFetch(`/approvals?status=pending`),
    apiFetch(`/files`)]);
  return {runs: (await runsR.json()).runs || [],
          approvals: (await aprR.json()).approvals || [],
          files: (await filesR.json()).files || []};
}
function buildCases({runs, approvals, files}){
  const cases = new Map();
  for(const r of [...runs].reverse()){
    const out = r.output || {};
    if(out.caseId && out.reply){
      const cif = out.caseId.split('-').pop();
      const m = (out.reply || '').match(/\(([^)]+)\)/);
      cases.set(out.caseId, {caseId: out.caseId, cif, product: out.caseId.split('-')[0],
        customer: m ? m[1] : 'New customer', opened: r.createdAt, updated: r.createdAt,
        docs: 0, status: 'collecting'});
    }
  }
  for(const c of cases.values()){
    c.docs = new Set(files.filter(f => (f.tags||{}).cif === c.cif && (f.tags||{}).docType)
                          .map(f => f.tags.docType)).size;
    const caseJobs = runs.filter(r => r.trigger === 'job' && r.job
      && String((r.job.payload||{}).cif) === String(c.cif));
    const compose = caseJobs.find(r => r.job.handler === 'compose_report');
    for(const r of caseJobs) if(r.createdAt > c.updated) c.updated = r.createdAt;
    if(compose && compose.status === 'completed') c.status = 'submitted';
    else if(approvals.some(a => (a.title||'').includes(c.cif))) c.status = 'review';
    else if(caseJobs.length) c.status = 'extracting';
    else if(c.docs >= 4) c.status = 'extracting';
  }
  return [...cases.values()].sort((a,b) => (b.updated||'').localeCompare(a.updated||''));
}
const STATUS_BADGE = {collecting:'b-wait', extracting:'b-run', review:'b-appr', submitted:'b-done'};

/* thread reconstruction: the server is the source of truth */
async function rebuildThread(){
  try{
    const data = await fetchAll();
    const {runs, approvals, files} = data;
    const mine = runs.filter(r => {
      const out = r.output || {}, ev = r.event || {};
      if(out.caseId === state.caseId) return true;
      return ev.type === 'file.uploaded' && ((ev.payload||{}).tags||{}).cif === state.cif;
    }).sort((a,b) => (a.createdAt||'').localeCompare(b.createdAt||''));

    let opener = null;
    for(const r of mine){
      const ev = r.event || {}, out = r.output || {};
      if(ev.type === 'message.received'){
        if((ev.payload||{}).text) say('user', ev.payload.text, {instant:true, ts:r.createdAt, generic:true});
        if(out.reply){ say('agent', out.reply, {instant:true, ts:r.createdAt}); opener = opener || r; }
      }else if(ev.type === 'file.uploaded'){
        const tg = (ev.payload||{}).tags||{};
        say('agent', `Received ${tg.docType}${(out.missing||[]).length ? ' - still needed: ' + out.missing.join(', ') : ''}.`,
            {activity:true, ts:r.createdAt});
        if((out.status||'') === 'extracting')
          say('agent', 'Document set complete - extracting all four documents.', {activity:true, icon:IC_EXTRACT, ts:r.createdAt});
      }
    }
    for(const f of files){
      const tg = f.tags || {};
      if(tg.cif === state.cif && tg.docType){
        state.uploaded[tg.docType] = true; state.filenames[tg.docType] = f.name; state.sizes[tg.docType] = f.size;
      }
    }
    const detail = opener ? await (await apiFetch(`/runs/${opener.id}`)).json() : {trace: []};
    const m = opener && (opener.output.reply || '').match(/\(([^)]+)\)/);
    if(m && !((detail.trace||[]).some(e => e.label === 'archive.lookup_cif')))
      detail.trace = [...(detail.trace||[]), {kind:'tool.call', label:'archive.lookup_cif',
        data:{result:{customer:{customerName: m[1]}}}}];
    openCase(detail);
    if(Object.keys(state.uploaded).length >= DOCS.length) setStep(1);
    const caseJobs = runs.filter(r => r.trigger === 'job' && r.job
      && String((r.job.payload||{}).cif) === String(state.cif));
    const compose = caseJobs.find(r => r.job.handler === 'compose_report');
    if(compose && compose.status === 'completed'){
      setStep(4); $('doneCard').style.display = 'block';
      say('agent', 'Approved - the renewal record and final report are written to the LA database.', {activity:true, ts:compose.updatedAt});
    }
    await poll();
  }catch(e){
    say('agent', 'Could not load this case - is the agent running?', {instant:true});
  }
}

/* ================= chat primitives ================= */
function say(cls, text, opts={}){
  const t = document.createElement('div');
  if(opts.activity){
    t.className = 'turn activity';
    t.innerHTML = `<span class="av">${opts.icon || IC_FILE}</span>
      <div class="tbody"><div class="ttext"></div></div>`;
    t.querySelector('.ttext').textContent = text;
    $('msgs').appendChild(t); $('msgs').scrollTop = 1e9;
    return t;
  }
  t.className = 'turn ' + cls;
  const agent = cls === 'agent';
  t.innerHTML = `<span class="av">${agent ? 'R' : (opts.generic ? 'RM' : initials(auth && auth.email))}</span>
    <div class="tbody">
      <div class="tmeta"><span class="tname">${agent ? 'Renewal Agent' : (opts.generic || !auth ? 'Relationship Manager' : emailName(auth.email))}</span>
        <span class="when">${hhmm(opts.ts)}</span></div>
      <div class="ttext">${opts.html || ''}</div>
    </div>`;
  $('msgs').appendChild(t);
  const body = t.querySelector('.ttext');
  if(!opts.html && text){
    if(agent && !opts.instant) typewrite(body, text);
    else body.textContent = text;
  }
  $('msgs').scrollTop = 1e9;
  return t;
}
function typewrite(el, text){
  const words = text.split(' '); let i = 0;
  const step = Math.max(1, Math.round(words.length / 26));
  const tick = () => {
    i = Math.min(words.length, i + step);
    el.textContent = words.slice(0, i).join(' ');
    $('msgs').scrollTop = 1e9;
    if(i < words.length) setTimeout(tick, 26);
  };
  tick();
}
function typing(){
  return say('agent', '', {html:'<span class="typing"><i></i><i></i><i></i></span>'});
}
function countUp(el, target, ms=600){
  const t0 = performance.now();
  const tick = now => {
    const p = Math.min(1, (now - t0) / ms);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
    if(p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function setStep(n){
  state.step = Math.max(state.step, n);
  $('steps').innerHTML = STEPS.map((s, i) => {
    const cls = i < state.step ? 'done' : i === state.step ? 'on' : '';
    return `<span class="step ${cls}"><span class="dt"></span>${s}</span>` +
      (i < STEPS.length - 1 ? `<span class="step-line ${i < state.step ? 'fill' : ''}"><i></i></span>` : '');
  }).join('');
}
function renderMd(md){
  const cite = s => s.replace(/\[source: ?([^\]]+)\]/g, '<span class="cite">$1</span>');
  const inline = s => cite(escapeHtml(s)).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const lines = md.split('\n'); let out = [], table = [];
  const flush = () => { if(!table.length) return;
    const rows = table.filter(r => !/^\|[\s|:-]+\|$/.test(r));
    out.push('<table>' + rows.map((r, i) => {
      const cells = r.replace(/^\||\|$/g,'').split('|').map(c => inline(c.trim()));
      const tag = i === 0 ? 'th' : 'td';
      return '<tr>' + cells.map(c => `<${tag}>${c}</${tag}>`).join('') + '</tr>';
    }).join('') + '</table>'); table = []; };
  for(const ln of lines){
    if(/^\|/.test(ln.trim())){ table.push(ln.trim()); continue; } flush();
    const t = ln.trim();
    if(!t || t === '---') continue;
    if(t.startsWith('## ')) out.push(`<div class="h2r">${inline(t.slice(3))}</div>`);
    else if(t.startsWith('# ')) out.push(`<div class="h1r">${inline(t.slice(2))}</div>`);
    else out.push(`<p>${inline(t)}</p>`);
  }
  flush(); return out.join('');
}

/* ================= workspace behavior ================= */
function fill(text){ $('input').value = text; send(); }
async function send(){
  const text = $('input').value.trim(); if(!text) return;
  $('input').value = ''; $('suggest').style.display = 'none';
  say('user', text); $('send').disabled = true;
  const tp = typing();
  try{
    const r = await apiFetch(`/agents/loan-renewal/events`, {method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({type:'message.received', payload:{text}})});
    const {runId} = await r.json();
    const run = await (await apiFetch(`/runs/${runId}`)).json();
    const out = run.output || {};
    tp.remove(); say('agent', out.reply || 'Done.');
    if(out.caseId && !state.caseId){
      state.caseId = out.caseId; state.cif = out.caseId.split('-').pop();
      history.replaceState(null, '', '#/case/' + out.caseId);
      $('whTitle').textContent = out.caseId;
      openCase(run); startPolling();
    }
  }catch(e){ tp.remove(); say('agent', 'Something went wrong - ' + e.message, {instant:true}); }
  $('send').disabled = false;
}
function openCase(run){
  $('emptyState').style.display = 'none';
  $('caseCard').style.display = $('docsCard').style.display = 'block';
  $('caseId').textContent = state.caseId; $('cif').textContent = state.cif;
  $('product').textContent = state.caseId.split('-')[0];
  const lookup = (run.trace || []).find(e => e.kind === 'tool.call' && e.label === 'archive.lookup_cif');
  const cust = lookup && lookup.data && lookup.data.result && lookup.data.result.customer;
  $('customer').textContent = cust ? cust.customerName : 'New customer';
  $('whTitle').textContent = state.caseId;
  $('whSub').textContent = cust ? cust.customerName : '';
  setStep(0); renderDocs();
}
function renderDocs(){
  $('docRows').innerHTML = '';
  const got = Object.keys(state.uploaded).length;
  $('docCount').textContent = `${got} of ${DOCS.length}`;
  for(const d of DOCS){
    const row = document.createElement('div'); row.className = 'row';
    const meta = state.filenames[d.key]
      ? `<span class="meta"><span class="mono">${escapeHtml(state.filenames[d.key])}</span>` +
        (state.sizes[d.key] ? `<span class="tnum">${fmtKb(state.sizes[d.key])}</span>` : '') + '</span>'
      : `<span class="meta">awaiting upload</span>`;
    const right = state.uploaded[d.key]
      ? `<span class="badge b-done"><svg class="ic" style="width:10px;height:10px" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>received</span>`
      : `<span class="up-actions">
           <button class="quiet" onclick="pickFile('${d.key}')">
             <svg class="ic" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
             Upload</button>
           <button class="quiet" onclick="uploadSample('${d.key}')">Use sample</button>
         </span>`;
    row.innerHTML = `<span class="doc-ic">${DOC_ICONS[d.key]}</span>
      <span class="grow"><span class="lbl">${d.label}</span>${meta}</span>${right}`;
    row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('dragover'); });
    row.addEventListener('dragleave', () => row.classList.remove('dragover'));
    row.addEventListener('drop', e => {
      e.preventDefault(); row.classList.remove('dragover');
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if(f) uploadFile(d.key, f);
    });
    $('docRows').appendChild(row);
  }
}
function pickFile(key){
  const inp = $('filePick');
  inp.onchange = () => { if(inp.files[0]) uploadFile(key, inp.files[0]); inp.value = ''; };
  inp.click();
}
async function uploadFile(key, file){
  const buf = await file.arrayBuffer();
  await postDoc(key, file.name, buf, file.type || 'application/octet-stream');
}
async function uploadSample(key){
  const pdf = await (await fetch(`samples/${key}.pdf`)).arrayBuffer();
  await postDoc(key, `${key}.pdf`, pdf, 'application/pdf');
}
async function postDoc(key, filename, buf, ctype){
  const q = `name=${encodeURIComponent(filename)}&tag.cif=${state.cif}&tag.docType=${key}`;
  const r = await apiFetch(`/files?${q}`, {method:'POST',
    headers:{'content-type': ctype}, body: buf});
  const body = await r.json();
  state.uploaded[key] = true; state.filenames[key] = filename;
  state.sizes[key] = (body.file || {}).size; renderDocs();
  const run = await (await apiFetch(`/runs/${body.runId}`)).json();
  const out = run.output || {};
  if(out.missing && out.missing.length)
    say('agent', `Received ${key} - still needed: ${out.missing.join(', ')}.`, {activity:true});
  else if(out.status === 'extracting'){
    say('agent', 'Document set complete - extracting all four documents now.', {activity:true, icon:IC_EXTRACT});
    setStep(1); $('pipeCard').style.display = 'block';
  }
}
function jobDur(j){
  try{
    const a = new Date(j.createdAt), b = new Date(j.updatedAt || j.createdAt);
    const s = Math.max(0, Math.round((b - a) / 1000));
    return s ? `${s}s` : '';
  }catch(e){ return ''; }
}
async function poll(){
  if(!state || !state.cif) return;
  try{
    const runs = (await (await apiFetch(`/agents/loan-renewal/runs`)).json()).runs || [];
    const jobs = runs.filter(r => r.trigger === 'job'
      && r.job && r.job.payload && String(r.job.payload.cif) === String(state.cif));
    if(jobs.length){
      $('pipeCard').style.display = 'block';
      $('pipeRows').innerHTML = '';
      for(const j of jobs.slice(0, 8).reverse()){
        const name = j.job.handler, doc = j.job.payload.docType;
        let badge, dot;
        if(j.status === 'completed'){ badge = '<span class="badge b-done">completed</span>'; dot = 'done'; }
        else if(j.status === 'failed'){ badge = '<span class="badge b-fail">failed</span>'; dot = 'fail'; }
        else if(j.status === 'waiting_approval'){ badge = '<span class="badge b-appr">awaiting approval</span>'; dot = 'appr'; }
        else { badge = '<span class="badge b-run"><span class="spin"></span>running</span>'; dot = 'run'; }
        const row = document.createElement('div'); row.className = 'tlrow';
        row.innerHTML = `<span class="tldot ${dot}"></span>
          <span class="grow mono">${name}${doc ? ' - ' + doc : ''}</span>
          <span class="dur tnum">${j.status === 'completed' ? jobDur(j) : ''}</span>${badge}`;
        $('pipeRows').appendChild(row);
      }
    }
    const approvals = (await (await apiFetch(`/approvals?status=pending`)).json()).approvals || [];
    const mine = approvals.find(a => (a.title || '').includes(state.cif));
    if(mine && !state.approvalId){
      state.approvalId = mine.id; state.report = mine.body || '';
      setStep(2);
      $('reportCard').style.display = 'block';
      $('reportBody').innerHTML = renderMd(state.report);
      metaChips(runs);
      say('agent', 'The final report is ready and grounded - every figure cites its source document. Review it and approve to write the LA record.');
    }
  }catch(e){ /* transient */ }
}
async function metaChips(runs){
  try{
    const compose = runs.find(r => r.trigger === 'job' && r.job
      && r.job.handler === 'compose_report' && String(r.job.payload.cif) === String(state.cif));
    if(!compose) return;
    const detail = await (await apiFetch(`/runs/${compose.id}`)).json();
    const llm = (detail.trace || []).filter(e => e.kind === 'llm.respond').pop();
    const res = llm && llm.data && llm.data.result;
    const cites = (state.report.match(/\[source:/g) || []).length;
    const chips = [`<span class="chip mono">${res ? res.model.replace(/-\d{8}.*$/, '') : 'bedrock'}</span>`];
    if(res && res.usage) chips.push(`<span class="chip tnum">${res.usage.input} in / ${res.usage.output} out tokens</span>`);
    chips.push(`<span class="chip tnum">${cites} citations</span>`);
    chips.push(`<span class="chip" style="color:var(--pos)">grounding passed</span>`);
    $('metaStrip').innerHTML = chips.join('');
  }catch(e){ /* cosmetic */ }
}
function startPolling(){ if(state && !state.polling) state.polling = setInterval(poll, 2500); }

async function guided(){
  const b = $('guidedBtn'); if(b) b.disabled = true;
  $('input').value = 'I want to start an LA renewal application for CIF 884411';
  await send();
  if(!state.caseId) return;
  for(const d of DOCS.map(x => x.key)){
    if(!state.uploaded[d]){ await new Promise(r => setTimeout(r, 700)); await uploadSample(d); }
  }
  say('agent', 'Extraction is running - the approval stays yours: the demo never signs for you.', {activity:true});
}

/* ================= boot ================= */
renderUserFoot();
refreshBadge();
listTimer = setInterval(refreshBadge, 6000);
route();
</script>
