# Rya self-host: `cp .env.example .env && docker compose up`
#
# ONE DEPLOYMENT, TWO PROCESSES (PLATFORM_DESIGN §2). Both are the same platform
# image against the same Postgres; they are run modes, not microservices, and
# they coordinate through the queue table rather than by calling each other:
#
#   api     control plane — REST/WS/SSE, auth, scheduler, policy, guard, vault,
#           LLM gateway, approvals, console, MCP. Executes NO handler code.
#   worker  execution plane — loads the bundle, owns ctx/journal/replay, claims
#           from the queue, executes handlers.
#
# Production checklist (set these in .env): RYA_TOKEN (auth), RYA_SECRET_KEY
# (encrypt secrets at rest), RYA_WEBHOOK_SECRET (signed inbound), and — for
# multi-tenant — RYA_MULTITENANT=1 + RYA_ADMIN_TOKEN + RYA_APP_DB_PASSWORD.
#
# ---------------------------------------------------------------------------
# D8: run inputs are DECLARED, not ambient.
#
# Everything below is DEPLOYMENT identity — which database, which environment,
# how this process authenticates. That is legitimately environmental: it answers
# "which deployment am I?", not "what may this run do?".
#
# What must NOT live here is per-agent, per-environment RUN config: model routes,
# egress allowlists, tool credentials, prices. Those are platform state, set
# through the control plane so they are versioned, access-controlled and audited
# ("who reviewed this allowlist change" is a feature — §12 risk 7). A provider
# key passed here is the legacy single-tenant path; it is read once at
# resolution and recorded with `source: env` provenance.
# ---------------------------------------------------------------------------
x-rya-env: &rya-env
  RYA_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-rya}@postgres:5432/rya
  RYA_ENVIRONMENT: ${RYA_ENVIRONMENT:-prod}
  RYA_TOKEN: ${RYA_TOKEN:-}
  RYA_SECRET_KEY: ${RYA_SECRET_KEY:-}
  RYA_WEBHOOK_SECRET: ${RYA_WEBHOOK_SECRET:-}
  RYA_MULTITENANT: ${RYA_MULTITENANT:-}
  RYA_ADMIN_TOKEN: ${RYA_ADMIN_TOKEN:-}
  RYA_APP_DB_PASSWORD: ${RYA_APP_DB_PASSWORD:-}
  # Bundle archives (§5.3). The api WRITES here when `rya publish` uploads a
  # version; a pinned worker READS from here at cold start. They are separate
  # containers, so the store must be shared — a container-local `.rya/bundles`
  # would leave the worker resolving a version whose artifact it cannot see.
  #
  # `${VAR-default}` (no colon) on purpose: setting RYA_BUNDLES_S3_BUCKET= empty
  # in .env then genuinely falls back to the local directory arm, whereas `:-`
  # would treat empty as unset and force MinIO back on.
  RYA_BUNDLES_S3_BUCKET: ${RYA_BUNDLES_S3_BUCKET-rya-bundles}
  RYA_BUNDLES_S3_ENDPOINT: ${RYA_BUNDLES_S3_ENDPOINT-http://minio:9000}
  # Must be non-empty even for MinIO, which ignores it: botocore raises
  # NoRegionError before it ever looks at the endpoint.
  RYA_BUNDLES_S3_REGION: ${RYA_BUNDLES_S3_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-miniosecret}
  # Legacy single-tenant model config. Prefer per-environment platform config.
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  RYA_LLM_MODEL: ${RYA_LLM_MODEL:-claude-haiku-4-5-20251001}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rya}
      POSTGRES_DB: rya
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - rya_pgdata:/var/lib/postgresql/data

  # The bundle archive store: an S3-compatible object store the api and the
  # workers share. `rya publish` PUTs the content-addressed archive here and a
  # pinned worker GETs it, verifying the hash before importing anything (D12).
  #
  # The bucket is created by `mkdir` rather than an `mc mb` init container: on the
  # filesystem backend a top-level directory in the data dir IS a bucket, so this
  # stays one service instead of two.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/${RYA_BUNDLES_S3_BUCKET-rya-bundles} &&
                 minio server /data --address ":9000" --console-address ":9001"'
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-miniosecret}
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      # Loopback-only: this holds every version's source. 9001 is the console —
      # useful for watching an archive object appear as you publish.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rya_minio:/data

  rya:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *rya-env
      # A dedicated worker service exists below, so the api process runs no
      # handler code (§11.7). Leaving the inline worker on would be harmless —
      # claims are leased, so the two would not double-execute a job — but it
      # would blur the boundary this split exists to draw, and make the local
      # topology differ from production for no benefit.
      RYA_API_INLINE_WORKER: "0"
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/healthz').status==200 else 1)\""]
      interval: 10s
      timeout: 4s
      retries: 6
    volumes:
      # Mount your agent project here (must contain rya.agent.yaml). Point
      # RYA_PROJECT at another tree to serve a different agent — e.g.
      # RYA_PROJECT=../rya-examples/chat-agent.
      - ${RYA_PROJECT:-./examples/followup_agent}:/project
      # Platform state (unpacked bundle cache, local archives) gets its own volume
      # rather than landing in the mounted source tree. The containers run as root,
      # so without this the worker leaves root-owned files inside the developer's
      # working copy that they cannot delete.
      - rya_project_state:/project/.rya

  # The execution plane. Claims chat turns and jobs from the queue, loads the
  # bundle, and runs handler code. The api process runs none, so without this
  # nothing executes — that is the isolation boundary, not an oversight (§11.7).
  #
  # Scale horizontally by raising `replicas`: claims are atomic
  # (FOR UPDATE SKIP LOCKED) and per-key concurrency caps keep one workspace
  # from starving another. Add `--version <id>` or `--env <name>` to serve one
  # pinned, content-hashed deployment (D3, D12).
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *rya-env
    volumes:
      - ${RYA_PROJECT:-./examples/followup_agent}:/project
      - rya_project_state:/project/.rya
    command: ["rya", "worker", "--interval", "2", "--concurrency", "4"]

  # The same execution plane, PINNED to whatever version `prod` points at.
  #
  # `docker compose --profile pinned up -d worker-pinned`
  #
  # Behind a profile because it is a different operating model, not a better one:
  # this worker serves ONE content-hashed bundle (D3 — the process IS the
  # version), so it ignores the mounted working tree and a re-publish needs a
  # restart to be picked up. That is what makes it the right thing to run after
  # `rya publish`, and the wrong thing for an edit-and-reload loop.
  #
  # It crash-loops until the first promotion, because resolving an environment
  # with no current version is an error (E_ENVIRONMENT_NOT_FOUND) rather than a
  # wait — hence `restart: unless-stopped`, which turns that into "comes up when
  # you publish".
  #
  # The project is still mounted: `rya worker` reads a local manifest to learn
  # which agent and environment to resolve. The CODE comes from the bundle, which
  # is unpacked into /project/.rya/bundles/unpacked/<hash> and hash-verified
  # before a single handler is imported.
  worker-pinned:
    build: .
    profiles: ["pinned"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment: *rya-env
    volumes:
      - ${RYA_PROJECT:-./examples/followup_agent}:/project
      - rya_project_state:/project/.rya
    command: ["rya", "worker", "--env", "prod", "--interval", "2", "--concurrency", "4"]

volumes:
  rya_pgdata:
  rya_minio:
  rya_project_state:
