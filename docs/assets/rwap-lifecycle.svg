<svg width="100%" viewBox="0 0 680 566" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Workflow lifecycle: created on RWAP, run on Rya">
<title>Workflow lifecycle: created on RWAP, run on Rya</title>
<desc>Build and deploy a workflow in RWAP, a trigger fires and enqueues a job to Rya, an RWAP worker leases and executes it while Rya provides durability and approvals, and status flows back to the RWAP console.</desc>
<defs><marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#9b9a97" stroke-width="1.4"/></marker></defs>
<rect x="0" y="0" width="680" height="566" rx="12" fill="#fbfbfa"/>
<rect x="40" y="34" width="600" height="54" rx="8" fill="#ffffff" stroke="#e3e2e0" stroke-width="1"/>
<circle cx="70" cy="61" r="13" fill="#1d1c1a"/>
<text x="70" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">1</text>
<text x="96" y="57" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#191918">Build the workflow</text>
<text x="96" y="75" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774">canvas blocks, saved to RWAP's own database</text>
<text x="624" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="end">RWAP</text>
<line x1="340" y1="88" x2="340" y2="108" stroke="#9b9a97" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
<rect x="40" y="108" width="600" height="54" rx="8" fill="#ffffff" stroke="#e3e2e0" stroke-width="1"/>
<circle cx="70" cy="135" r="13" fill="#1d1c1a"/>
<text x="70" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">2</text>
<text x="96" y="131" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#191918">Deploy, register triggers</text>
<text x="96" y="149" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774">webhook URL and cron schedules go live</text>
<text x="624" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="end">RWAP</text>
<line x1="340" y1="162" x2="340" y2="182" stroke="#9b9a97" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
<rect x="40" y="182" width="600" height="54" rx="8" fill="#ffffff" stroke="#e3e2e0" stroke-width="1"/>
<circle cx="70" cy="209" r="13" fill="#1d1c1a"/>
<text x="70" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">3</text>
<text x="96" y="205" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#191918">Trigger fires</text>
<text x="96" y="223" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774">builds a job payload: workflowId, input, correlation</text>
<text x="624" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="end">RWAP</text>
<line x1="340" y1="236" x2="340" y2="256" stroke="#9b9a97" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
<text x="352" y="250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="start">hands off to Rya</text>
<rect x="40" y="256" width="600" height="54" rx="8" fill="#edf1f6" stroke="#cfe0ef" stroke-width="1"/>
<circle cx="70" cy="283" r="13" fill="#37618e"/>
<text x="70" y="288" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">4</text>
<text x="96" y="279" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#191918">Enqueue to Rya</text>
<text x="96" y="297" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774">POST /queue/jobs, persisted durably (idempotent)</text>
<text x="624" y="288" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="end">RWAP to Rya</text>
<line x1="340" y1="310" x2="340" y2="330" stroke="#9b9a97" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
<rect x="40" y="330" width="600" height="54" rx="8" fill="#edf1f6" stroke="#cfe0ef" stroke-width="1"/>
<circle cx="70" cy="357" r="13" fill="#37618e"/>
<text x="70" y="362" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">5</text>
<text x="96" y="353" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#191918">Worker leases the job</text>
<text x="96" y="371" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774">RWAP worker long-polls /queue/claim, heartbeats</text>
<text x="624" y="362" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="end">Rya to worker</text>
<line x1="340" y1="384" x2="340" y2="404" stroke="#9b9a97" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
<rect x="40" y="404" width="600" height="60" rx="8" fill="#edf1f6" stroke="#cfe0ef" stroke-width="1"/>
<circle cx="70" cy="431" r="13" fill="#37618e"/>
<text x="70" y="436" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">6</text>
<text x="96" y="427" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#191918">Execute, with a safety net</text>
<text x="96" y="446" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774">worker runs the DAG; Rya adds pause-for-approval,</text>
<text x="96" y="460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774">retries + dead-letter, crash reclaim, the run journal</text>
<text x="624" y="436" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="end">worker + Rya</text>
<line x1="340" y1="464" x2="340" y2="484" stroke="#9b9a97" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
<rect x="40" y="484" width="600" height="54" rx="8" fill="#edf1f6" stroke="#cfe0ef" stroke-width="1"/>
<circle cx="70" cy="511" r="13" fill="#37618e"/>
<text x="70" y="516" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">7</text>
<text x="96" y="507" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#191918">Status and traces back</text>
<text x="96" y="525" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774">RWAP console reads run status + full forensic trace</text>
<text x="624" y="516" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="end">Rya to RWAP</text>
</svg>
