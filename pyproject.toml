[project]
name = "rya"
version = "0.1.0"
description = "Rya — production backend/runtime for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Plexe" }]
keywords = ["ai", "agents", "runtime", "backend", "llm", "mcp", "approvals", "agent-infrastructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "cryptography>=42.0",   # encryption-at-rest for vaulted connection secrets
]

[project.urls]
Homepage = "https://github.com/plexe-ai/rya"
Documentation = "https://github.com/plexe-ai/rya/tree/main/docs"
Repository = "https://github.com/plexe-ai/rya"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12.0"]
mcp = ["mcp>=1.2.0"]
postgres = ["psycopg[binary]>=3.1"]
llm = ["anthropic>=0.40"]
bedrock = ["boto3>=1.34"]     # AWS Bedrock provider (Converse API, IAM-signed - no API key)
deepeval = ["deepeval>=1.0"]  # LLM-output-quality eval metrics (`deepeval` scorer); needs a
                              # judge key (OPENAI_API_KEY, or ANTHROPIC_API_KEY + the `anthropic` pkg via rya[llm])
dev = ["pytest>=8.0", "psycopg[binary]>=3.1", "fastapi>=0.110", "httpx>=0.27", "ruff>=0.16"]

[project.scripts]
rya = "rya.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rya"]

[tool.hatch.build.targets.wheel.force-include]
"src/rya/console/index.html" = "rya/console/index.html"
"src/rya/console/lucide.min.js" = "rya/console/lucide.min.js"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter. `ruff check` / `ruff format` (see docs/devex.md).
#
# The existing tree is NOT yet clean against this config; it is the target we
# converge on file by file, not a gate. Nothing here is enforced in CI yet.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/rya/console", "site", ".rya"]

[tool.ruff.lint]
select = [
    "F",    # pyflakes — undefined names, unused imports/variables
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort — import ordering
    "UP",   # pyupgrade — modern syntax for our floor (py310)
    "B",    # flake8-bugbear — likely bugs
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length — the formatter owns wrapping; long strings/URLs stay
    "B008",    # call-in-default: Typer/FastAPI declare params this way by design
    "SIM105",  # contextlib.suppress is not always clearer than try/except: pass
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]      # conftest sets sys.path before importing rya
"examples/*" = ["E402"]   # examples favour narrative order over import hygiene

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
