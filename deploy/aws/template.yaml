AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rya — single-tenant deployment in the customer's AWS account. Realizes the
  reference posture: Cognito identity at the edge, ECS Fargate runtime behind an
  ALB, RDS Postgres with row-level security at the data, ElastiCache for hot
  reads, a single-purpose mutator Lambda that re-validates the caller's JWT, and
  all secrets in Secrets Manager. The customer owns the stack; no shared blast
  radius. Deploy: `sam build && sam deploy --guided`.

Parameters:
  DBMultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Multi-AZ RDS for production availability.
  AnthropicKeyEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Inject ANTHROPIC_API_KEY from the AppSecret (operator adds the key out of
      band). Bedrock deployments leave this false - the task role IAM identity
      is the model credential and no API key exists anywhere.
  ContainerImage:
    Type: String
    Description: ECR image URI for the Rya runtime (built from the repo Dockerfile).
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the ALB.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for the runtime, database, and cache.
  DBUsername:
    Type: String
    Default: rya
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
  DesiredCount:
    Type: Number
    Default: 2
    Description: Number of Fargate runtime tasks (scale horizontally on CPU).
  RyaSecretKey:
    Type: String
    NoEcho: true
    Description: Fernet key for encryption-at-rest of connection secrets (RYA_SECRET_KEY).
  RyaAdminToken:
    Type: String
    NoEcho: true
    Description: Admin token gating self-serve project provisioning (RYA_ADMIN_TOKEN).

Conditions:
  UseAnthropicKey: !Equals [!Ref AnthropicKeyEnabled, "true"]
  UseMultiAZ: !Equals [!Ref DBMultiAZ, "true"]

Resources:

  # ---- Identity (Cognito) -------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-client"
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  # ---- Secrets ------------------------------------------------------------
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/db"
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        # The password is interpolated into a postgresql:// URL - exclude every
        # character with URL semantics, not just quoting hazards. A '#', '%',
        # '[' or similar in the generated password breaks the DSN at parse time
        # (found live: first loan-renewal-live create drew '#%[').
        ExcludePunctuation: true

  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/app"
      Description: Application secrets — encryption key, admin token (set at deploy).
      SecretString: !Sub '{"RYA_JWT_SECRET":"jwks-mode-unused","RYA_SECRET_KEY":"${RyaSecretKey}","RYA_ADMIN_TOKEN":"${RyaAdminToken}"}'

  # ---- Networking (security groups) --------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Rya ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Rya runtime tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8787
          ToPort: 8787
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Rya Postgres
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ServiceSecurityGroup

  # ---- Data (RDS Postgres) -----------------------------------------------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Rya DB subnets
      SubnetIds: !Ref PrivateSubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: "20"
      DBName: rya
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DBSecurityGroup]
      StorageEncrypted: true
      MultiAZ: !If [UseMultiAZ, true, false]
      PubliclyAccessible: false

  # ---- Runtime (ECS Fargate behind an ALB) -------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 30

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: [!Ref AppSecret, !Ref DBSecret]

  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: archive-old-documents
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 180
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 900

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: files-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:HeadObject]
                Resource: !Sub "${FilesBucket.Arn}/*"
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-runtime"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: rya
          Image: !Ref ContainerImage
          PortMappings:
            - ContainerPort: 8787
          Environment:
            - Name: RYA_MULTITENANT
              Value: "1"
            - Name: RYA_FILES_S3_BUCKET
              Value: !Ref FilesBucket
            - Name: RYA_JWKS_URL
              Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
            - Name: RYA_DATABASE_URL
              Value: !Sub
                - "postgresql://${DBUsername}:${pw}@${Endpoint}:5432/rya"
                - pw: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:password}}"
                  Endpoint: !GetAtt Database.Endpoint.Address
          Secrets:
            - Name: RYA_JWT_SECRET
              ValueFrom: !Sub "${AppSecret}:RYA_JWT_SECRET::"
            - Name: RYA_SECRET_KEY
              ValueFrom: !Sub "${AppSecret}:RYA_SECRET_KEY::"
            - Name: RYA_ADMIN_TOKEN
              ValueFrom: !Sub "${AppSecret}:RYA_ADMIN_TOKEN::"
            # Model key: added to the AppSecret OUT of band (operator step, see
            # README "model keys populated post-deploy") - CloudFormation never
            # sees the value. The task fails to start if the JSON key is absent,
            # so populate the secret BEFORE deploying this reference.
            - !If
              - UseAnthropicKey
              - Name: ANTHROPIC_API_KEY
                ValueFrom: !Sub "${AppSecret}:ANTHROPIC_API_KEY::"
              - !Ref "AWS::NoValue"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: rya

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8787
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: "200"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      # rya serve runs tenancy.setup() (roles + RLS) against a cold RDS before it
      # answers /healthz — give it time before the ALB starts failing the task.
      HealthCheckGracePeriodSeconds: 240
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Public IP so tasks can pull the ECR image in a VPC without a NAT gateway.
          AssignPublicIp: ENABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: rya
          ContainerPort: 8787
          TargetGroupArn: !Ref TargetGroup

  # ---- Single-purpose mutator (the privileged-write pattern) -------------
  # Mutating tool calls travel here; this re-validates the caller's JWT before
  # touching the database, so the agent holds no privileged DB credentials.
  MutatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-mutator"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      InlineCode: |
        import json
        def handler(event, context):
            # In production: verify the Cognito JWT from the request, open a DB
            # connection as a non-superuser role with app.user_id set from the
            # verified sub, perform the single scoped write, return the result.
            return {"statusCode": 200, "body": json.dumps({"ok": True, "pattern": "single-purpose-mutator"})}

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]
        DefaultAuthorizer: CognitoJwt

  ServiceTasksAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Running task count below desired - service degraded.
      Namespace: AWS/ECS
      MetricName: RunningTaskCount
      Dimensions:
        - { Name: ClusterName, Value: !Ref Cluster }
        - { Name: ServiceName, Value: !GetAtt Service.Name }
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  DBCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Database CPU sustained high.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - { Name: DBInstanceIdentifier, Value: !Ref Database }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold

Outputs:
  AlbUrl:
    Description: Runtime URL (control + data plane) behind the ALB.
    Value: !Sub "http://${LoadBalancer.DNSName}"
  ApiUrl:
    Description: HTTP API edge (Cognito-JWT-authorized mutators).
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
