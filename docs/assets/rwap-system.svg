<text x="268.0" y="211" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#191918" text-anchor="middle">Durable runs</text>
<text x="268.0" y="227" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="middle">journal, replay</text>
<rect x="344" y="194" width="132" height="42" rx="6" fill="#ffffff" stroke="#e3e2e0" stroke-width="1"/>
