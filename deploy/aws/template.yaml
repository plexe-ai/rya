AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Rya — deployment in the customer's AWS account. The customer owns the stack, so
  self-hosting is a residency control: journal, memory, conversation history and
  sealed credentials stay in this account and region (PLATFORM_DESIGN §8).

  Shipped and wired: Cognito identity at the edge; TWO ECS Fargate services from
  one image — `api` (control plane, behind the ALB) and `worker` (execution plane,
  no inbound surface) coordinating through the queue table; RDS Postgres with
  row-level security; ElastiCache for hot reads; all secrets in Secrets Manager.

  NOT shipped, and deliberately failing closed rather than stubbed: the
  single-purpose mutator Lambda. It returns 501 and its template comment states
  what a real implementation must do. Do not read this stack as having that
  control.

  Deploy: `sam build && sam deploy --guided`.

Parameters:
  DBMultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Multi-AZ RDS for production availability.
  AnthropicKeyEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Inject ANTHROPIC_API_KEY from the AppSecret (operator adds the key out of
      band). Bedrock deployments leave this false - the task role IAM identity
      is the model credential and no API key exists anywhere.
  ContainerImage:
    Type: String
    Description: ECR image URI for the Rya runtime (built from the repo Dockerfile).
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Public subnets for the ALB.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for the runtime, database, and cache.
  DBUsername:
    Type: String
    Default: rya
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
  DesiredCount:
    Type: Number
    Default: 2
    Description: Number of Fargate runtime tasks (scale horizontally on CPU).
  RyaSecretKey:
    Type: String
    NoEcho: true
    Description: Fernet key for encryption-at-rest of connection secrets (RYA_SECRET_KEY).
  RyaAdminToken:
    Type: String
    NoEcho: true
    Description: Admin token gating self-serve project provisioning (RYA_ADMIN_TOKEN).
  RyaEnvironment:
    Type: String
    Default: prod
    Description: >
      Which environment this deployment IS (dev/staging/prod). Deployment
      identity, not agent config — D11 deletes `environment:` from the manifest
      so one content-hashed bundle is promoted between environments unchanged.
  WorkerCount:
    Type: Number
    Default: 2
    Description: >
      Number of execution-plane tasks. The api process runs NO handler code
      (§11.7), so with 0 the control plane accepts work and nothing executes it.

Conditions:
  UseAnthropicKey: !Equals [!Ref AnthropicKeyEnabled, "true"]
  UseMultiAZ: !Equals [!Ref DBMultiAZ, "true"]

Resources:

  # ---- Identity (Cognito) -------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${AWS::StackName}-client"
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  # ---- Secrets ------------------------------------------------------------
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/db"
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        # The password is interpolated into a postgresql:// URL - exclude every
        # character with URL semantics, not just quoting hazards. A '#', '%',
        # '[' or similar in the generated password breaks the DSN at parse time
        # (found live: first loan-renewal-live create drew '#%[').
        ExcludePunctuation: true

  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/app"
      Description: Application secrets — encryption key, admin token (set at deploy).
      SecretString: !Sub '{"RYA_JWT_SECRET":"jwks-mode-unused","RYA_SECRET_KEY":"${RyaSecretKey}","RYA_ADMIN_TOKEN":"${RyaAdminToken}"}'

  # ---- Networking (security groups) --------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Rya ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Rya runtime tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8787
          ToPort: 8787
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Rya Postgres
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ServiceSecurityGroup

  # ---- Data (RDS Postgres) -----------------------------------------------
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Rya DB subnets
      SubnetIds: !Ref PrivateSubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: "20"
      DBName: rya
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DBSecurityGroup]
      StorageEncrypted: true
      MultiAZ: !If [UseMultiAZ, true, false]
      PubliclyAccessible: false

  # ---- Runtime (ECS Fargate behind an ALB) -------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 30

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: [!Ref AppSecret, !Ref DBSecret]

  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: archive-old-documents
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: 180
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]
            MaxAge: 900

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: files-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:HeadObject]
                Resource: !Sub "${FilesBucket.Arn}/*"
        - PolicyName: bedrock-invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-runtime"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: rya
          Image: !Ref ContainerImage
          PortMappings:
            - ContainerPort: 8787
          # ---------------------------------------------------------------
          # D8: run inputs are DECLARED, not ambient.
          #
          # Everything here is DEPLOYMENT IDENTITY — which database, which
          # environment, how this process authenticates itself. That is
          # legitimately environmental: it answers "which deployment am I?",
          # not "what may this run do?".
          #
          # What must NOT be added here is per-agent RUN config: model routes,
          # egress allowlists, tool credentials, prices. Those are platform
          # state, set through the control plane so they are versioned,
          # access-controlled and audited — §12 risk 7 makes "who reviewed this
          # allowlist change" a feature rather than a residual. A provider key
          # injected below is the legacy single-tenant path; it is read once at
          # route resolution and recorded with `source: env` provenance.
          # ---------------------------------------------------------------
          Environment:
            - Name: RYA_MULTITENANT
              Value: "1"
            - Name: RYA_ENVIRONMENT
              Value: !Ref RyaEnvironment
            # §11.7: the api process executes NO handler code, and multi-tenant
            # mode forces its inline worker off regardless of this value. It is
            # set explicitly so the topology is legible in the template rather
            # than implied by a default — the WorkerService below is what runs.
            - Name: RYA_API_INLINE_WORKER
              Value: "0"
            - Name: RYA_FILES_S3_BUCKET
              Value: !Ref FilesBucket
            - Name: RYA_JWKS_URL
              Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
            - Name: RYA_DATABASE_URL
              Value: !Sub
                - "postgresql://${DBUsername}:${pw}@${Endpoint}:5432/rya"
                - pw: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:password}}"
                  Endpoint: !GetAtt Database.Endpoint.Address
          Secrets:
            - Name: RYA_JWT_SECRET
              ValueFrom: !Sub "${AppSecret}:RYA_JWT_SECRET::"
            - Name: RYA_SECRET_KEY
              ValueFrom: !Sub "${AppSecret}:RYA_SECRET_KEY::"
            - Name: RYA_ADMIN_TOKEN
              ValueFrom: !Sub "${AppSecret}:RYA_ADMIN_TOKEN::"
            # Model key: added to the AppSecret OUT of band (operator step, see
            # README "model keys populated post-deploy") - CloudFormation never
            # sees the value. The task fails to start if the JSON key is absent,
            # so populate the secret BEFORE deploying this reference.
            - !If
              - UseAnthropicKey
              - Name: ANTHROPIC_API_KEY
                ValueFrom: !Sub "${AppSecret}:ANTHROPIC_API_KEY::"
              - !Ref "AWS::NoValue"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: rya

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Subnets: !Ref PublicSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: 8787
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: "200"

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      # rya serve runs tenancy.setup() (roles + RLS) against a cold RDS before it
      # answers /healthz — give it time before the ALB starts failing the task.
      HealthCheckGracePeriodSeconds: 240
      NetworkConfiguration:
        AwsvpcConfiguration:
          # Public IP so tasks can pull the ECR image in a VPC without a NAT gateway.
          AssignPublicIp: ENABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: rya
          ContainerPort: 8787
          TargetGroupArn: !Ref TargetGroup

  # ---- The execution plane (PLATFORM_DESIGN §2, §5.2, §11.7) --------------
  # One deployment, TWO processes. The api service above is the control plane and
  # executes NO handler code; this is what loads bundles and runs them. They are
  # run modes of the same image against the same Postgres, coordinating through
  # the queue table (D4) — there is no api→worker call to configure.
  #
  # Without this service the stack accepts events, enqueues them, and never runs
  # them: severing handler execution from the api process (§11.7) is what makes
  # per-tenant isolation mean anything, and it also means the worker is no longer
  # optional.
  #
  # No ALB target and no port: a worker has no inbound surface. It claims work
  # (FOR UPDATE SKIP LOCKED), heartbeats its lease, and exits idle. Scale on queue
  # depth; per-key concurrency caps keep one workspace from starving another (§6).
  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-worker"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: worker
          Image: !Ref ContainerImage
          Command: ["rya", "worker", "--interval", "2", "--concurrency", "4"]
          # Same deployment identity as the api task, same D8 rule: nothing
          # per-agent belongs here. A worker resolves its run config from
          # platform state, not from this block.
          Environment:
            - Name: RYA_MULTITENANT
              Value: "1"
            - Name: RYA_ENVIRONMENT
              Value: !Ref RyaEnvironment
            - Name: RYA_FILES_S3_BUCKET
              Value: !Ref FilesBucket
            - Name: RYA_DATABASE_URL
              Value: !Sub
                - "postgresql://${DBUsername}:${pw}@${Endpoint}:5432/rya"
                - pw: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:password}}"
                  Endpoint: !GetAtt Database.Endpoint.Address
          Secrets:
            - Name: RYA_SECRET_KEY
              ValueFrom: !Sub "${AppSecret}:RYA_SECRET_KEY::"
            - !If
              - UseAnthropicKey
              - Name: ANTHROPIC_API_KEY
                ValueFrom: !Sub "${AppSecret}:ANTHROPIC_API_KEY::"
              - !Ref "AWS::NoValue"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref WorkerCount
      TaskDefinition: !Ref WorkerTaskDefinition
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]

  # ---- Single-purpose mutator (the privileged-write pattern) -------------
  # The INTENDED pattern: mutating tool calls travel here, and this re-validates
  # the caller's Cognito JWT before touching the database, so the agent process
  # holds no privileged DB credentials.
  #
  # It is NOT IMPLEMENTED, and it fails closed rather than pretending to be.
  # The previous version returned `{"ok": true}` unconditionally while the stack
  # description advertised JWT re-validation — a security control that answers
  # "yes" to everything is worse than an absent one, because it reads as covered
  # in a review. Verifying an RS256 JWT against Cognito's JWKS needs a crypto
  # library, which `InlineCode` cannot carry, so a correct implementation must
  # ship as a real packaged function (a Lambda layer or an image) that:
  #
  #   1. fetches and caches the pool's JWKS, verifying kid/alg/iss/aud/exp,
  #   2. connects as the non-superuser `rya_app` role with `app.user_id` set from
  #      the VERIFIED `sub` (see tenancy.py — the RLS policies depend on it),
  #   3. performs one scoped write and returns its result.
  #
  # Until then nothing should route to it, and a 501 says so unambiguously.
  MutatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-mutator"
      Runtime: python3.12
      Handler: index.handler
      Timeout: 15
      InlineCode: |
        import json

        def handler(event, context):
            # Fail closed. See the template comment above this function for what
            # a real implementation must do before this is enabled.
            return {
                "statusCode": 501,
                "headers": {"content-type": "application/json"},
                "body": json.dumps({
                    "code": "E_NOT_IMPLEMENTED",
                    "message": "The single-purpose mutator is a deployment pattern, not a "
                               "shipped implementation.",
                    "hint": "It must verify the Cognito JWT and connect as rya_app with "
                            "app.user_id set from the verified sub before it may perform any "
                            "write. Replace this InlineCode with a packaged function.",
                }),
            }

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience: [!Ref UserPoolClient]
        DefaultAuthorizer: CognitoJwt

  ServiceTasksAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Running task count below desired - service degraded.
      Namespace: AWS/ECS
      MetricName: RunningTaskCount
      Dimensions:
        - { Name: ClusterName, Value: !Ref Cluster }
        - { Name: ServiceName, Value: !GetAtt Service.Name }
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  DBCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Database CPU sustained high.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - { Name: DBInstanceIdentifier, Value: !Ref Database }
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold

Outputs:
  AlbUrl:
    Description: Runtime URL (control + data plane) behind the ALB.
    Value: !Sub "http://${LoadBalancer.DNSName}"
  ApiUrl:
    Description: HTTP API edge (Cognito-JWT-authorized mutators).
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Value: !Ref UserPool
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
