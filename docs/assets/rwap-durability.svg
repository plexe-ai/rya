<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One workflow job: durable, self-scaling, with retries">
<title>One workflow job - durable, self-scaling, with retries</title>
<desc>A single job's state machine: enqueued idempotently, claimed under a lease, completed or retried with backoff to a dead-letter, and reclaimed if a worker crashes. Below, a worker pool scales the same queue with no double-claims.</desc>
<style>
  text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  .t{font-size:14px;fill:#191918}.ts{font-size:12px;fill:#787774}.th{font-size:14px;font-weight:600;fill:#191918}.tl{font-size:11.5px;fill:#787774}
  .box{fill:#ffffff;stroke:#e3e2e0;stroke-width:1}
  .blue .box{fill:#edf1f6;stroke:#cfe0ef}.green .box{fill:#ecf3f0;stroke:#cfe6de}.amber .box{fill:#faf3eb;stroke:#f0e2c0}.grey .box{fill:#f3f2f0;stroke:#e3e2e0}
  .arr{stroke:#9b9a97;stroke-width:1.5;fill:none;marker-end:url(#c)}
  .arrb{stroke:#c2691f;stroke-width:1.5;fill:none;marker-end:url(#ca)}
</style>
<defs>
  <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#9b9a97" stroke-width="1.4"/></marker>
  <marker id="ca" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#c2691f" stroke-width="1.4"/></marker>
</defs>
<rect x="0" y="0" width="680" height="470" rx="12" fill="#fbfbfa"/>

<text class="th" x="40" y="34">One workflow run = one durable job</text>
<text class="ts" x="40" y="52">it survives crashes and retries on its own; the queue scales by adding workers</text>

<!-- state machine -->
<text class="ts" x="24" y="104" transform="rotate(-90 24 104)" text-anchor="middle">enqueue</text>
<line class="arr" x1="40" y1="104" x2="72" y2="104"/>
<g class="blue"><rect class="box" x="72" y="80" width="120" height="48" rx="8"/><text class="t" x="132" y="101" text-anchor="middle">pending</text><text class="ts" x="132" y="118" text-anchor="middle">idempotent (jobId)</text></g>
<line class="arr" x1="192" y1="104" x2="270" y2="104"/><text class="tl" x="231" y="96" text-anchor="middle">claim + lease</text>
<g><rect class="box" x="270" y="80" width="120" height="48" rx="8"/><text class="t" x="330" y="101" text-anchor="middle">running</text><text class="ts" x="330" y="118" text-anchor="middle">heartbeat holds lease</text></g>
<line class="arr" x1="390" y1="104" x2="468" y2="104"/><text class="tl" x="429" y="96" text-anchor="middle">report ok</text>
<g class="green"><rect class="box" x="468" y="80" width="120" height="48" rx="8"/><text class="t" x="528" y="101" text-anchor="middle">completed</text><text class="ts" x="528" y="118" text-anchor="middle">output stored</text></g>

<!-- fail -> retry -->
<line class="arr" x1="330" y1="128" x2="330" y2="196"/><text class="tl" x="338" y="160" text-anchor="start">fail</text>
<g class="amber"><rect class="box" x="270" y="196" width="120" height="52" rx="8"/><text class="t" x="330" y="217" text-anchor="middle">retry</text><text class="ts" x="330" y="234" text-anchor="middle">exponential backoff</text></g>
<!-- retry -> pending (attempts left) -->
<path class="arrb" d="M270,214 C180,214 132,180 132,132"/><text class="tl" x="170" y="196" text-anchor="middle" fill="#c2691f">attempts &lt; max</text>
<!-- retry -> dead-letter -->
<line class="arrb" x1="390" y1="222" x2="468" y2="222"/><text class="tl" x="429" y="214" text-anchor="middle" fill="#c2691f">exhausted</text>
<g class="grey"><rect class="box" x="468" y="196" width="120" height="52" rx="8"/><text class="t" x="528" y="217" text-anchor="middle">dead-letter</text><text class="ts" x="528" y="234" text-anchor="middle">inspect + replay</text></g>

<!-- crash reclaim -->
<path class="arr" d="M300,128 C250,168 175,168 132,132"/><text class="tl" x="196" y="162" text-anchor="middle">worker crash: lease expires, reclaimed</text>

<line x1="40" y1="290" x2="640" y2="290" stroke="#ebebea"/>

<!-- scaling -->
<text class="th" x="40" y="318">Scales on its own</text>
<g class="blue"><rect class="box" x="40" y="332" width="150" height="96" rx="8"/><text class="t" x="115" y="356" text-anchor="middle">queue</text><text class="ts" x="115" y="374" text-anchor="middle">many jobs</text><text class="ts" x="115" y="392" text-anchor="middle">FOR UPDATE</text><text class="ts" x="115" y="408" text-anchor="middle">SKIP LOCKED</text></g>
<g><rect class="box" x="250" y="332" width="150" height="44" rx="8"/><text class="t" x="325" y="359" text-anchor="middle">worker 1</text></g>
<g><rect class="box" x="250" y="384" width="150" height="44" rx="8"/><text class="t" x="325" y="411" text-anchor="middle">worker 2 ... N</text></g>
<line class="arr" x1="190" y1="360" x2="250" y2="354"/>
<line class="arr" x1="190" y1="400" x2="250" y2="406"/>
<g><rect class="box" x="440" y="332" width="200" height="96" rx="8"/><text class="th" x="460" y="356">Guarantees</text><text class="ts" x="460" y="376">no two workers claim one job</text><text class="ts" x="460" y="394">per-key concurrency caps</text><text class="ts" x="460" y="412">add workers = more throughput</text></g>
</svg>
