<svg width="100%" viewBox="0 0 680 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RWAP and Rya on AWS">
<title>RWAP and Rya on AWS</title>
<desc>Two ECS Fargate plus RDS Postgres stacks in one AWS account and VPC: the RWAP builder and its workers on the left, Rya on the right, bridged by Rya's queue API, over shared AWS services.</desc>
<style>
  text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  .t{font-size:13px;fill:#191918}.ts{font-size:12px;fill:#787774}.th{font-size:13.5px;font-weight:600;fill:#191918}
  .box{fill:#ffffff;stroke:#e3e2e0;stroke-width:1}
  .blue .box{fill:#edf1f6;stroke:#cfe0ef}
  .arr{stroke:#9b9a97;stroke-width:1.5;fill:none;marker-end:url(#c)}
</style>
<defs><marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#9b9a97" stroke-width="1.4"/></marker></defs>
<rect x="0" y="0" width="680" height="476" rx="12" fill="#fbfbfa"/>

<text class="ts" x="40" y="24">AWS us-east-1 · one account · one VPC</text>
<text class="th" x="640" y="24" text-anchor="end" fill="#37618e">blue = Rya</text>
<text class="ts" x="536" y="24" text-anchor="end">grey = RWAP  ·</text>

<text class="ts" x="40" y="50">users / webhooks</text>
<line class="arr" x1="130" y1="44" x2="182" y2="74"/>
<line class="arr" x1="150" y1="44" x2="470" y2="74"/>

<rect x="36" y="60" width="300" height="306" rx="10" fill="none" stroke="#e3e2e0" stroke-dasharray="4 4"/>
<text class="ts" x="52" y="78">RWAP stack</text>
<g><rect class="box" x="60" y="86" width="252" height="38" rx="7"/><text class="t" x="186" y="110" text-anchor="middle">CloudFront + ALB (HTTPS)</text></g>
<g><rect class="box" x="60" y="138" width="252" height="50" rx="7"/><text class="th" x="186" y="160" text-anchor="middle">RWAP app · ECS Fargate</text><text class="ts" x="186" y="178" text-anchor="middle">Next.js visual builder</text></g>
<g><rect class="box" x="60" y="202" width="252" height="50" rx="7"/><text class="th" x="186" y="224" text-anchor="middle">RWAP worker · Fargate</text><text class="ts" x="186" y="242" text-anchor="middle">createRyaQueueWorker, scales alone</text></g>
<g><rect class="box" x="60" y="266" width="252" height="44" rx="7"/><text class="th" x="186" y="286" text-anchor="middle">RDS Postgres</text><text class="ts" x="186" y="302" text-anchor="middle">workflow definitions</text></g>
<line class="arr" x1="186" y1="188" x2="186" y2="202"/>
<line class="arr" x1="186" y1="252" x2="186" y2="266"/>

<rect x="344" y="60" width="300" height="306" rx="10" fill="none" stroke="#cfe0ef" stroke-dasharray="4 4"/>
<text class="ts" x="360" y="78" fill="#37618e">Rya stack</text>
<g><rect class="box" x="368" y="86" width="252" height="38" rx="7"/><text class="t" x="494" y="110" text-anchor="middle">CloudFront + ALB (HTTPS)</text></g>
<g class="blue"><rect class="box" x="368" y="138" width="252" height="50" rx="7"/><text class="th" x="494" y="160" text-anchor="middle">Rya · ECS Fargate</text><text class="ts" x="494" y="178" text-anchor="middle">rya serve: API, queue, console</text></g>
<g class="blue"><rect class="box" x="368" y="202" width="252" height="50" rx="7"/><text class="th" x="494" y="224" text-anchor="middle">RDS Postgres · RLS</text><text class="ts" x="494" y="242" text-anchor="middle">jobs, runs, leases, approvals</text></g>
<g><rect class="box" x="368" y="266" width="252" height="44" rx="7"/><text class="th" x="494" y="286" text-anchor="middle">Cognito + Secrets Manager</text><text class="ts" x="494" y="302" text-anchor="middle">identity, model keys</text></g>
<line class="arr" x1="494" y1="188" x2="494" y2="202"/>

<line class="arr" x1="312" y1="163" x2="368" y2="105"/>
<line class="arr" x1="368" y1="114" x2="312" y2="217"/>
<text class="ts" x="340" y="130" text-anchor="middle">queue</text><text class="ts" x="340" y="144" text-anchor="middle">API</text>

<g><rect class="box" x="36" y="382" width="608" height="44" rx="8"/><text class="th" x="52" y="402">Shared</text><text class="ts" x="52" y="418">CloudWatch logs · ECR images · private subnets · NAT</text><text class="ts" x="628" y="410" text-anchor="end">egress: Anthropic API</text></g>
</svg>
