<svg width="100%" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One workflow job - durable, self-scaling, with retries">
<title>One workflow job - durable, self-scaling, with retries</title>
<desc>A single job's state machine with retries, dead-letter, crash reclaim, and a worker pool that scales with no double-claims.</desc>
<defs><marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#9b9a97" stroke-width="1.4"/></marker><marker id="ca" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#c2691f" stroke-width="1.4"/></marker></defs>
<rect x="0" y="0" width="680" height="470" rx="12" fill="#fbfbfa"/>
<text x="40" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#191918">One workflow run = one durable job</text>
<text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774">it survives crashes and retries on its own; the queue scales by adding workers</text>
<text x="24" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="middle" transform="rotate(-90 24 104)">enqueue</text>
<line x1="40" y1="104" x2="72" y2="104" stroke="#9b9a97" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
<rect x="72" y="80" width="120" height="48" rx="8" fill="#edf1f6" stroke="#cfe0ef" stroke-width="1"/>
<text x="132" y="101" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#191918" text-anchor="middle">pending</text>
<text x="132" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="middle">idempotent (jobId)</text>
<line x1="192" y1="104" x2="270" y2="104" stroke="#9b9a97" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
<text x="231" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#787774" text-anchor="middle">claim + lease</text>
<rect x="270" y="80" width="120" height="48" rx="8" fill="#ffffff" stroke="#e3e2e0" stroke-width="1"/>
<text x="330" y="101" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#191918" text-anchor="middle">running</text>
<text x="330" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="middle">heartbeat holds lease</text>
<line x1="390" y1="104" x2="468" y2="104" stroke="#9b9a97" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
<text x="429" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#787774" text-anchor="middle">report ok</text>
<rect x="468" y="80" width="120" height="48" rx="8" fill="#ecf3f0" stroke="#cfe6de" stroke-width="1"/>
<text x="528" y="101" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#191918" text-anchor="middle">completed</text>
<text x="528" y="118" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="middle">output stored</text>
<line x1="330" y1="128" x2="330" y2="196" stroke="#9b9a97" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
<text x="338" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#787774" text-anchor="start">fail</text>
<rect x="270" y="196" width="120" height="52" rx="8" fill="#faf3eb" stroke="#f0e2c0" stroke-width="1"/>
<text x="330" y="217" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#191918" text-anchor="middle">retry</text>
<text x="330" y="234" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="middle">exponential backoff</text>
<path d="M270,214 C180,214 132,180 132,132" stroke="#c2691f" stroke-width="1.5" fill="none" marker-end="url(#ca)"/>
<text x="170" y="192" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#c2691f" text-anchor="middle">attempts &lt; max</text>
<line x1="390" y1="222" x2="468" y2="222" stroke="#c2691f" stroke-width="1.5" fill="none" marker-end="url(#ca)"/>
<text x="429" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#c2691f" text-anchor="middle">exhausted</text>
<rect x="468" y="196" width="120" height="52" rx="8" fill="#f3f2f0" stroke="#e3e2e0" stroke-width="1"/>
<text x="528" y="217" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#191918" text-anchor="middle">dead-letter</text>
<text x="528" y="234" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="middle">inspect + replay</text>
<path d="M300,128 C250,168 175,168 132,132" stroke="#9b9a97" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
<text x="202" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#787774" text-anchor="middle">worker crash: lease expires, reclaimed</text>
<line x1="40" y1="290" x2="640" y2="290" stroke="#ebebea" stroke-width="1" fill="none"/>
<text x="40" y="318" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#191918">Scales on its own</text>
<rect x="40" y="332" width="150" height="96" rx="8" fill="#edf1f6" stroke="#cfe0ef" stroke-width="1"/>
<text x="115" y="356" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#191918" text-anchor="middle">queue</text>
<text x="115" y="374" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="middle">many jobs</text>
<text x="115" y="392" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="middle">FOR UPDATE</text>
<text x="115" y="408" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774" text-anchor="middle">SKIP LOCKED</text>
<rect x="250" y="332" width="150" height="44" rx="8" fill="#ffffff" stroke="#e3e2e0" stroke-width="1"/>
<text x="325" y="359" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#191918" text-anchor="middle">worker 1</text>
<rect x="250" y="384" width="150" height="44" rx="8" fill="#ffffff" stroke="#e3e2e0" stroke-width="1"/>
<text x="325" y="411" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#191918" text-anchor="middle">worker 2 ... N</text>
<line x1="190" y1="360" x2="250" y2="354" stroke="#9b9a97" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
<line x1="190" y1="400" x2="250" y2="406" stroke="#9b9a97" stroke-width="1.5" fill="none" marker-end="url(#c)"/>
<rect x="440" y="332" width="200" height="96" rx="8" fill="#ffffff" stroke="#e3e2e0" stroke-width="1"/>
<text x="460" y="356" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#191918">Guarantees</text>
<text x="460" y="376" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774">no two workers claim one job</text>
<text x="460" y="394" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774">per-key concurrency caps</text>
<text x="460" y="412" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#787774">add workers = more throughput</text>
</svg>
