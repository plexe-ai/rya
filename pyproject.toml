[project]
name = "rya"
version = "0.1.0"
description = "Rya — production backend/runtime for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Plexe" }]
keywords = ["ai", "agents", "runtime", "backend", "llm", "mcp", "approvals", "agent-infrastructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "cryptography>=42.0",   # encryption-at-rest for vaulted connection secrets
]

[project.urls]
Homepage = "https://github.com/plexe-ai/rya"
Documentation = "https://github.com/plexe-ai/rya/tree/main/docs"
Repository = "https://github.com/plexe-ai/rya"

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "websockets>=12.0"]
mcp = ["mcp>=1.2.0"]
postgres = ["psycopg[binary]>=3.1"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "psycopg[binary]>=3.1", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
rya = "rya.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rya"]

[tool.hatch.build.targets.wheel.force-include]
"src/rya/console/index.html" = "rya/console/index.html"
"src/rya/console/lucide.min.js" = "rya/console/lucide.min.js"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
