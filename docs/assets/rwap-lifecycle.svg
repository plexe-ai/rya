<svg width="100%" viewBox="0 0 680 566" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Workflow lifecycle: created on RWAP, run on Rya">
<title>Workflow lifecycle: created on RWAP, run on Rya</title>
<desc>Build and deploy a workflow in RWAP, a trigger fires and enqueues a job to Rya, an RWAP worker leases and executes it while Rya provides durability and approvals, and status flows back to the RWAP console.</desc>
<style>
  text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  .ts{font-size:12px;fill:#787774}.th{font-size:14px;font-weight:600;fill:#191918}
  .box{fill:#ffffff;stroke:#e3e2e0;stroke-width:1}
  .blue .box{fill:#edf1f6;stroke:#cfe0ef}
  .arr{stroke:#9b9a97;stroke-width:1.5;fill:none;marker-end:url(#c)}
</style>
<defs><marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1,1 L7,4.5 L1,8" fill="none" stroke="#9b9a97" stroke-width="1.4"/></marker></defs>
<rect x="0" y="0" width="680" height="566" rx="12" fill="#fbfbfa"/>

<g><rect class="box" x="40" y="34" width="600" height="54" rx="8"/></g>
<circle cx="70" cy="61" r="13" fill="#1d1c1a"/><text class="th" x="70" y="66" text-anchor="middle" fill="#fff">1</text>
<text class="th" x="96" y="57">Build the workflow</text><text class="ts" x="96" y="75">canvas blocks, saved to RWAP's own database</text><text class="ts" x="624" y="66" text-anchor="end">RWAP</text>
<line class="arr" x1="340" y1="88" x2="340" y2="108"/>

<g><rect class="box" x="40" y="108" width="600" height="54" rx="8"/></g>
<circle cx="70" cy="135" r="13" fill="#1d1c1a"/><text class="th" x="70" y="140" text-anchor="middle" fill="#fff">2</text>
<text class="th" x="96" y="131">Deploy, register triggers</text><text class="ts" x="96" y="149">webhook URL and cron schedules go live</text><text class="ts" x="624" y="140" text-anchor="end">RWAP</text>
<line class="arr" x1="340" y1="162" x2="340" y2="182"/>

<g><rect class="box" x="40" y="182" width="600" height="54" rx="8"/></g>
<circle cx="70" cy="209" r="13" fill="#1d1c1a"/><text class="th" x="70" y="214" text-anchor="middle" fill="#fff">3</text>
<text class="th" x="96" y="205">Trigger fires</text><text class="ts" x="96" y="223">builds a job payload: workflowId, input, correlation</text><text class="ts" x="624" y="214" text-anchor="end">RWAP</text>
<line class="arr" x1="340" y1="236" x2="340" y2="256"/><text class="ts" x="352" y="250" text-anchor="start">hands off to Rya</text>

<g class="blue"><rect class="box" x="40" y="256" width="600" height="54" rx="8"/></g>
<circle cx="70" cy="283" r="13" fill="#37618e"/><text class="th" x="70" y="288" text-anchor="middle" fill="#fff">4</text>
<text class="th" x="96" y="279">Enqueue to Rya</text><text class="ts" x="96" y="297">POST /queue/jobs, persisted durably (idempotent)</text><text class="ts" x="624" y="288" text-anchor="end">RWAP to Rya</text>
<line class="arr" x1="340" y1="310" x2="340" y2="330"/>

<g class="blue"><rect class="box" x="40" y="330" width="600" height="54" rx="8"/></g>
<circle cx="70" cy="357" r="13" fill="#37618e"/><text class="th" x="70" y="362" text-anchor="middle" fill="#fff">5</text>
<text class="th" x="96" y="353">Worker leases the job</text><text class="ts" x="96" y="371">RWAP worker long-polls /queue/claim, heartbeats</text><text class="ts" x="624" y="362" text-anchor="end">Rya to worker</text>
<line class="arr" x1="340" y1="384" x2="340" y2="404"/>

<g class="blue"><rect class="box" x="40" y="404" width="600" height="60" rx="8"/></g>
<circle cx="70" cy="434" r="13" fill="#37618e"/><text class="th" x="70" y="439" text-anchor="middle" fill="#fff">6</text>
<text class="th" x="96" y="428">Execute, with a safety net</text><text class="ts" x="96" y="446">worker runs the DAG; Rya adds pause-for-approval,</text><text class="ts" x="96" y="460">retries + dead-letter, crash reclaim, the run journal</text><text class="ts" x="624" y="439" text-anchor="end">worker + Rya</text>
<line class="arr" x1="340" y1="464" x2="340" y2="484"/>

<g class="blue"><rect class="box" x="40" y="484" width="600" height="54" rx="8"/></g>
<circle cx="70" cy="511" r="13" fill="#37618e"/><text class="th" x="70" y="516" text-anchor="middle" fill="#fff">7</text>
<text class="th" x="96" y="507">Status and traces back</text><text class="ts" x="96" y="525">RWAP console reads run status + full forensic trace</text><text class="ts" x="624" y="516" text-anchor="end">Rya to RWAP</text>
</svg>
