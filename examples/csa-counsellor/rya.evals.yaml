# Behavioural checks mirroring production expectations.
#
# These assert routing/governance guarantees an eval can prove regardless of the
# model's exact wording. The offline mock provider drives a deterministic
# call-first-tool-then-answer loop, so multi-tool sequences are only fully
# exercised under a real provider. The deterministic correctness gates live in
# unit tests, NOT here:
#   - A2 id-secrecy scrub: tests/test_guard.py (ported from utils.test.ts).
#   - Phase-2 CAMS/workspace logic + the master-id-vs-CAMS-id contract + cards:
#     examples/csa-counsellor/tests/test_agent_phase2.py.
# The server-side camsId pin (shortlist/compare can never target another student)
# is enforced by the runtime and covered by the core pin tests; there is no
# "content-absent" scorer, so absence of the raw master id is asserted in the
# unit tests, and the evals below assert the positive signals (scrub token in the
# trace, card emitted).
evals:
  - id: replies_without_error
    trigger:
      type: message.received
      payload: { email: "counsellor@csa.test", body: "student asking about UK masters" }
    expect:
      status: completed
      no_failure: true
      max_tokens: 100000

  - id: discovery_uses_catalogue
    trigger:
      type: message.received
      payload: { email: "counsellor@csa.test",
                 body: "find postgraduate computer science options in the UK for September 2026" }
    expect:
      status: completed
      tools_called: [course_catalogue]

  - id: discovery_never_uses_hidden
    # The hidden/API-only tools (course_search, course_recommendations,
    # apply_to_programme) are permission: disabled, so ctx.llm.run never exposes
    # them and the model can never route to them — runtime-enforced, not prompted.
    trigger:
      type: message.received
      payload: { email: "counsellor@csa.test",
                 body: "recommend some universities and apply me to one" }
    expect:
      status: completed
      tools_not_called: [course_search, course_recommendations, apply_to_programme]

  - id: outbound_email_requires_human
    trigger:
      type: message.received
      payload: { email: "counsellor@csa.test", body: "please email the student the shortlist",
                 sendEmail: true, studentEmail: "ada@student.test" }
    expect:
      status: waiting_approval
      approval_requested: true
      trace_lacks: run.failed

  # ---- Phase 2 — CAMS lookups + workspace ---------------------------------
  - id: master_id_never_surfaced
    # A CAMS lookup whose raw record carries an alphanumeric master id
    # (IjmQ1782803306) alongside the numeric CAMS id (1472802). The A2 scrub fires
    # at the tool boundary, so the trace carries the "(id hidden)" token — never
    # the raw master id (asserted absent in test_agent_phase2.py).
    trigger:
      type: message.received
      payload: { email: "counsellor@csa.test",
                 body: "look up the student with CAMS id 1472802 and tell me their CAMS id" }
    expect:
      status: completed
      tools_called: [cams_lookup_student]
      result_contains: "(id hidden)"

  - id: duplicates_renders_card
    # Duplicate-check intent routes to duplicates_check and the handler emits a
    # `duplicates` UI frame (ctx.emit_ui -> a ui.emit trace event).
    trigger:
      type: message.received
      payload: { email: "counsellor@csa.test",
                 body: "is any other agency already handling the student with CAMS id 1472802?" }
    expect:
      status: completed
      tools_called: [duplicates_check]
      trace_has: [ui.emit]
      result_contains: "duplicates"

  # ---- Phase 3 — lead creation + retry/repair (A1) + adoption (A5) ---------
  # The deterministic Phase-3 gates live in tests/test_agent_phase3.py (retry
  # never double-creates, self-heal via @agent.repair, camsId adoption + order-
  # independence) and tests/test_retry_repair.py (the core A1/A5 primitives).
  # These live evals assert the positive routing signal: a lead-creation request
  # reaches create_lead and the run completes with the retry/adoption wiring in
  # place.
  - id: create_lead_routes_and_completes
    trigger:
      type: message.received
      payload: { email: "counsellor@csa.test",
                 body: "file a new lead: name Sam Lee, passport X7654321, destination United Kingdom, postgraduate for September 2026" }
    expect:
      status: completed
      tools_called: [create_lead]
      no_failure: true

  - id: create_lead_selfheals_recoverable
    # The destination is misspelled verbatim on the counsellor's form. create_lead
    # raises a recoverable error, @agent.repair snaps it to the closest valid
    # destination, and the runtime retries — surfacing a tool.repair trace step
    # and completing (never a run.failed).
    trigger:
      type: message.received
      payload: { email: "counsellor@csa.test",
                 body: "create a lead exactly as written on the form (keep the spelling verbatim): name Priya Raman, passport M4455667, course type postgraduate, destination 'Untied Kingdon'" }
    expect:
      status: completed
      tools_called: [create_lead]
      trace_lacks: run.failed

  # ---- Phase 4 — approval-gated writes made real (B5) ---------------------
  # Gated writes execute ONLY through a durable approval action, never inside the
  # model loop. The write intent is detected from the turn payload (mirroring the
  # counsellor UI's confirm affordance), the resolved pinned camsId is baked into
  # the action, and the run suspends for a human. The deterministic gates
  # (pinned-camsId baking, the grounding block, the write landing on the pinned
  # student) live in tests/test_agent_phase4.py; these live evals assert the
  # positive governance signal — the run pauses for approval and never fails.
  - id: loan_requires_human
    # A loan is a money write: the run must suspend for a human, never auto-apply.
    trigger:
      type: message.received
      payload: { email: "counsellor@csa.test", body: "start a loan application for this student",
                 camsId: "1472802", loanApply: true, loanAmount: 22000 }
    expect:
      status: waiting_approval
      approval_requested: true
      trace_lacks: run.failed

  - id: update_application_requires_human
    trigger:
      type: message.received
      payload: { email: "counsellor@csa.test", body: "mark this student's visa as filed",
                 camsId: "1472802", updateApplication: { status: "Visa Filed" } }
    expect:
      status: waiting_approval
      approval_requested: true
      trace_lacks: run.failed

  - id: gated_tool_never_in_loop
    # Even asked outright, the loop can never route to a gated write — they are
    # absent from the exposed tool set (runtime-enforced, not prompted). No gated
    # payload flags here, so the turn simply completes with none of them called.
    trigger:
      type: message.received
      payload: { email: "counsellor@csa.test",
                 body: "go ahead and update the application status, apply for a loan, and email the student" }
    expect:
      status: completed
      tools_not_called: [loan_apply_for_student, crizac_update_application,
                         cams_update_profile, submit_scholarship_enquiry, send_email]

  # ---- Phase 5 — prediction + tail + reconnect ----------------------------
  # The deterministic Phase-5 gates live in tests: offer_prediction's graceful
  # degradation (unconfigured → {ok:false}, never a raise) in
  # tests/test_agent_phase5.py, and the E_CONNECTION_EXPIRED → needs_reconnect
  # outcome + upsert/fail-closed/plaintext in tests/test_connection_a3.py (no
  # offline provider can synthesise an upstream 401). This live eval asserts the
  # positive signal: an offer-prediction request completes without a run failure
  # even though Plexe is unconfigured offline (the tool degrades, it never throws).
  - id: offer_prediction_graceful_when_down
    trigger:
      type: message.received
      payload: { email: "counsellor@csa.test",
                 body: "predict this student's offer probability: 10th 85%, 12th 88%, IELTS 7.0, course cost 38000 for MSc Computer Science" }
    expect:
      status: completed
      no_failure: true
      trace_lacks: run.failed
